name: Instalação limpa
on: [push, pull_request]
jobs:
  primeiro-uso:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          printf '%s\n' "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: npm ci
      - run: npm test
      - run: npm run diagnostico
      - run: npm run configurar -- --modo gravado --nome "Teste CI" --nicho "Demonstração" --estilo-basico
      - run: npm run exemplo -- test-output/vertical "9:16"
      - run: npm run exemplo -- test-output/horizontal "16:9"
      - run: node tests/e2e-upload-local.mjs test-output/vertical/final.mp4 test-output/vertical/capa.jpg test-output/upload-local
